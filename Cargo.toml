[package]
name = "brain"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tempfile = "3.27.0"
uuid = { version = "1", features = ["serde", "v4"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize", "serialize"] }
pulldown-cmark = { version = "=0.13.6", default-features = false }
